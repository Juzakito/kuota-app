services:
  postgres:
    image: postgres:16-alpine
    container_name: kuota-postgres
    environment:
      POSTGRES_DB: kuota
      POSTGRES_USER: kuota
      POSTGRES_PASSWORD: kuota_demo_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kuota_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuota -d kuota"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  kuota_postgres_data:
